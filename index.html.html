<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今天的心情｜SEL 情緒四象限</title><style>
:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#12345c;background:#f4f8fd}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}header{text-align:center;margin:14px 0 22px}h1{font-size:clamp(28px,4vw,44px);margin:0 0 10px}p{line-height:1.6}.sub{color:#526b87}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tile{border:3px solid transparent;border-radius:20px;min-height:150px;padding:20px 10px;text-align:center;color:#12345c;display:flex;align-items:center;justify-content:center;flex-direction:column}.tile strong{font-size:clamp(24px,3vw,35px)}.tile .emoji{font-size:42px}.tile small{font-size:14px;margin-top:6px}.red{background:#ffe0e1}.yellow{background:#fff0bd}.blue{background:#d9eaff}.green{background:#d9f2df}button.tile{cursor:pointer;width:100%;font:inherit}button.tile:focus-visible{outline:4px solid #1d65c5}button.tile.selected{border-color:#173e72;box-shadow:0 0 0 2px white inset}.panel{background:white;border-radius:20px;padding:22px;box-shadow:0 8px 25px #153c6612}.center{text-align:center}.status{margin-top:18px;text-align:center;min-height:24px}.stats .tile{min-height:205px}.count{font-size:clamp(30px,5vw,60px);font-weight:800}.percent{font-size:20px}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pill{display:inline-block;background:#e6f1ff;border-radius:999px;padding:9px 15px;color:#145ba8;font-weight:700}a{color:#145ba8}#qr{background:white;padding:8px;display:inline-block;border-radius:12px}#qr img,#qr canvas{max-width:100%}.qrbox{text-align:center;max-width:320px;margin:20px auto}.muted{font-size:13px;color:#5b6d81}.error{color:#a52222}.hidden{display:none}@media(min-width:800px){.dashboard{display:grid;grid-template-columns:1fr 270px;gap:20px}.stats .tile{min-height:245px}}@media(max-width:520px){.wrap{padding:12px}.panel{padding:14px}.tile{min-height:145px}.stats .tile{min-height:175px}.tile .emoji{font-size:32px}}
</style></head><body><main class="wrap"><header><h1>🌤️ 今天的心情</h1><p class="sub">實習將近兩個月，此刻的你，心情如何？</p></header><section id="voter" class="panel"><p class="center">選擇最接近現在心情的一個象限，不需要填寫姓名或原因。</p><div class="grid" id="voteGrid"></div><p class="status" id="voteStatus" aria-live="polite">正在連線…</p><p class="muted center">可以更改選擇；同一瀏覽器的匿名登入通常只計算一票。請勿在無痕模式重複投票。</p></section><section id="presenter" class="hidden"><div class="topline"><h2>現場情緒分布</h2><span class="pill" id="total">已回應 0 人</span></div><div class="dashboard"><div class="grid stats" id="statsGrid"></div><div class="panel qrbox"><h3>掃描 QR Code 投票</h3><div id="qr"></div><p class="muted" id="voteLink"></p><p class="muted">免登入表單・不填姓名・點一下即可完成</p></div></div><p class="status" id="presenterStatus">正在連線…</p></section><footer class="center muted" style="margin:22px">四種情緒都可以存在，沒有標準答案。<br>本活動僅用於暖身，不作個人情緒評估。</footer></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getDatabase,ref,set,onValue} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
// 請將下方設定替換為 Firebase 專案「網頁應用程式」提供的設定值。
const firebaseConfig = {
  apiKey: "AIzaSyBPB2Rotrl5yEi6jn1ONWxW9qpFrU79KCA",
  authDomain: "sel-mood-training.firebaseapp.com",
  databaseURL: "https://sel-mood-training-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sel-mood-training",
  storageBucket: "sel-mood-training.firebasestorage.app",
  messagingSenderId: "13929007276",
  appId: "1:13929007276:web:676a5b5814f3fd09a9b709"
};
const moods=[{id:'anxious',label:'焦慮',emoji:'😰',hint:'高活力・不舒服',color:'red'},{id:'happy',label:'開心',emoji:'😄',hint:'高活力・舒服',color:'yellow'},{id:'sad',label:'難過',emoji:'😢',hint:'低活力・不舒服',color:'blue'},{id:'calm',label:'平靜',emoji:'😌',hint:'低活力・舒服',color:'green'}];
const params=new URLSearchParams(location.search);const isPresenter=params.get('view')==='results';const room=(params.get('room')||'return-training-2026').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,60)||'return-training-2026';
const voteUrl=new URL(location.href);voteUrl.search='?room='+encodeURIComponent(room);voteUrl.hash='';
document.getElementById('voter').classList.toggle('hidden',isPresenter);document.getElementById('presenter').classList.toggle('hidden',!isPresenter);
const statusEl=document.getElementById(isPresenter?'presenterStatus':'voteStatus');const say=(msg,error=false)=>{statusEl.textContent=msg;statusEl.classList.toggle('error',error)};
if(isPresenter){document.getElementById('voteLink').textContent=voteUrl.href;if(window.QRCode)new QRCode(document.getElementById('qr'),{text:voteUrl.href,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});}
if(firebaseConfig.apiKey.startsWith('PASTE_')){say('尚未完成 Firebase 設定。請先依照教學填入專案設定。',true);}else{
try{const app=initializeApp(firebaseConfig);const db=getDatabase(app);const votesRef=ref(db,`rooms/${room}/votes`);
if(isPresenter){const grid=document.getElementById('statsGrid');grid.innerHTML=moods.map(m=>`<div class="tile ${m.color}"><div class="emoji">${m.emoji}</div><strong>${m.label}</strong><div class="count" id="count-${m.id}">0</div><div class="percent" id="pct-${m.id}">0%</div></div>`).join('');onValue(votesRef,s=>{const votes=Object.values(s.val()||{});const total=votes.length;document.getElementById('total').textContent=`已回應 ${total} 人`;moods.forEach(m=>{const count=votes.filter(v=>v===m.id).length;document.getElementById('count-'+m.id).textContent=count;document.getElementById('pct-'+m.id).textContent=(total?Math.round(count*100/total):0)+'%';});say('即時更新中 ✓');},e=>say('讀取失敗：'+e.message,true));}
else{const auth=getAuth(app);const grid=document.getElementById('voteGrid');grid.innerHTML=moods.map(m=>`<button type="button" class="tile ${m.color}" data-mood="${m.id}" disabled><span class="emoji">${m.emoji}</span><strong>${m.label}</strong><small>${m.hint}</small></button>`).join('');const buttons=[...grid.querySelectorAll('button')];let userId=null;const mark=(choice)=>buttons.forEach(b=>b.classList.toggle('selected',b.dataset.mood===choice));buttons.forEach(b=>b.addEventListener('click',async()=>{if(!userId)return;buttons.forEach(x=>x.disabled=true);say('送出中…');try{await set(ref(db,`rooms/${room}/votes/${userId}`),b.dataset.mood);mark(b.dataset.mood);say('✓ 已收到你的選擇，謝謝參與！你可以點選其他心情來修改。');}catch(e){say('送出失敗：'+e.message,true)}finally{buttons.forEach(x=>x.disabled=false)}}));onAuthStateChanged(auth,u=>{if(u){userId=u.uid;buttons.forEach(x=>x.disabled=false);onValue(ref(db,`rooms/${room}/votes/${u.uid}`),s=>mark(s.val()),()=>{});say('請點選一個最接近此刻心情的選項。');}});signInAnonymously(auth).catch(e=>say('匿名連線失敗：'+e.message,true));}
}catch(e){say('網站初始化失敗：'+e.message,true)}}
</script></body></html>
